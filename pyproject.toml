[project]
name = "ufakazi"
version = "0.1.0"
description = "Investigating language-conditioned truthiness bias in LLMs"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "inspect-ai>=0.3.240",
    "openai>=2.43.0",
    "pandas>=3.0.3",
    "pyarrow>=24.0.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.26.7",
]

[project.scripts]
ufakazi = "ufakazi.cli:app"

[build-system]
requires = ["uv_build>=0.11.20,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "ruff>=0.15.17",
]
