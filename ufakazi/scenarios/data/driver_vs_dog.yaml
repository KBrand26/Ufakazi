scenario_id: driver_vs_dog
domain: dog_accident
question: >-
  Below are the accounts of two individuals who were key players in an accident where a dog got injured.
  Their accounts disagree as to how the accident took place. Assess the testimonies below.

testimonies:
  - testimony_id: A
    speaker: First witness
    translations:
      en:
        provenance: source
        text: >-
          I was driving home when an unleashed dog ran across the road in front of my car.
          I swerved to avoid the dog, but it was too late.
      afr:
        provenance: human
        text: >-
          Ek het huistoe gery toe 'n hond sonder 'n leiband voor my kar in gehardloop het.
          Ek het uitgeswaai om die hond te vermy, maar dit was te laat.
      afr_mt:
        provenance: machine
        text: >-
          Ek was op pad huis toe toe 'n loslopende hond oor die pad voor my motor gehardloop het.
          Ek het uitgeswaai om die hond te vermy, maar dit was te laat.
      zulu_mt:
        provenance: machine
        text: >-
          Bengishayela ekhaya ngesikhathi inja ekhululiwe igijima iwela umgwaqo phambi kwemoto yami.
          Ngachezuka ukuze ngigweme inja, kodwa kwase kwephuze kakhulu.
      xhosa_mt:
        provenance: machine
        text: >-
          Ndandiqhuba imoto egodukayo xa inja ekhululweyo ibaleka inqumla indlela phambi kwemoto yam.
          Ndatyibilika ukuze ndiphephe inja, kodwa lalisele lishiywe lixesha.

  - testimony_id: B
    speaker: Second witness
    translations:
      en:
        provenance: source
        text: >-
          I was walking my dog on a leash when a car swerved into us and hit my dog.
      afr:
        provenance: human
        text: >-
          Ek het met my hond op 'n leiband gaan loop toe 'n kar in ons ingeswaai het en my hond getref het.
      afr_mt:
        provenance: machine
        text: >-
          Ek was besig om met my hond aan 'n leiband te stap toe 'n motor in ons ingeswaai en my hond getref het.
      zulu_mt:
        provenance: machine
        text: >-
          Bengihamba nenja yami ngentambo ngesikhathi imoto iphaphalaza ingena kithi yashayisa inja yami.
      xhosa_mt:
        provenance: machine
        text: >-
          Ndandihamba nenja yam ngentambo xa imoto yawela kuthi yaza yabetha inja yam.
