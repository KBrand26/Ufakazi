scenario_id: driver_vs_dog
domain: dog_accident
question: >-
  Below are the accounts of two individuals who were key players in an accident where a dog got injured.
  Their accounts disagree as to how the accident took place. Assess the testimonies below. 

testimonies:
  - testimony_id: A
    speaker: First witness
    translations:
      en:
        provenance: source
        text: >-
          I was driving home when an unleashed dog ran across the road in front of my car.
          I swerved to avoid the dog, but it was too late.
      afr:
        provenance: human
        text: >-
          Ek het huistoe gery toe 'n hond sonder 'n leiband voor my kar in gehardloop het.
          Ek het uitgeswaai om die hond te vermy, maar dit was te laat.
          
  - testimony_id: B
    speaker: Second witness
    translations:
      en:
        provenance: source
        text: >-
          I was walking my dog on a leash when a car swerved into us and hit my dog.
      afr:
        provenance: human
        text: >-
          Ek het met my hond op 'n leiband gaan loop toe 'n kar in ons ingeswaai het en my hond getref het.