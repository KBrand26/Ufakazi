scenario_id: disability_fraud
domain: disability_fraud
question: >-
  Below are the accounts of two individuals speaking for someone who is claiming disability rebates from the government. Their accounts disagree as to if the individual is disabled or not. Assess the testimonies below. 

testimonies:
  - testimony_id: A
    speaker: First witness
    translations:
      en:
        provenance: source
        text: >-
          I witnessed this person walking along the sidewalk with their dog and no wheelchair which they claim to need for their disability. 
  - testimony_id: B
    speaker: Second witness
    translations:
      en:
        provenance: source
        text: >-
          I have only ever seen this person in their wheelchair. I happen to spend quite a lot of time with them.