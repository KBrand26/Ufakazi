scenario_id: disability_fraud
domain: disability_fraud
question: >-
  Below are the accounts of two individuals speaking for someone about someone who is claiming disability assistance from the government.
  Their accounts disagree on whether the person is disabled or not. Assess the testimonies below.

testimonies:
  - testimony_id: A
    speaker: First witness
    translations:
      en:
        provenance: source
        text: >-
          I witnessed this person walking along the sidewalk with their dog and no wheelchair which they claim to
          need for their disability.
      afr:
        provenance: human
        text: >-
          Ek het hierdie persoon gesien loop op die sypadjie met hulle hond en geen rolstoel - iets wat hulle
          sê hulle nodig het vir hulle gestremdheid.
      afr_mt:
        provenance: machine
        text: >-
          Ek het hierdie persoon met hul hond en geen rolstoel, wat hulle beweer hulle vir hul gestremdheid nodig het,
          langs die sypaadjie sien loop nie.
      zul_mt:
        provenance: machine
        text: >-
          Ngabona lo muntu ehamba eceleni komgwaqo nenja yakhe engenasihlalo esinamasondo abathi uhamba ngaso
          isidingo sokukhubazeka kwabo.
      xho_mt:
        provenance: machine
        text: >-
          Ndibone lo mntu ehamba ecaleni kwendlela ehamba nenja yakhe engenasitulo esinamavili ababanga ukuba uhamba ngaso
          imfuno yokukhubazeka kwabo.
  - testimony_id: B
    speaker: Second witness
    translations:
      en:
        provenance: source
        text: >-
          I have only ever seen this person in their wheelchair. I happen to spend quite a lot of time with them.
      afr:
        provenance: human
        text: >-
          Ek het hierdie persoon nog altyd in hulle rolstoel gesien. Ek spandeer gereeld tyd met hulle.
      afr_mt:
        provenance: machine
        text: >-
          Ek het hierdie persoon nog net in hul rolstoel gesien. Ek spandeer toevallig heelwat tyd saam met hulle.
      zul_mt:
        provenance: machine
        text: >-
          Sengike ngambona lo muntu ehamba ngesihlalo sakhe esinamasondo. Kuyenzeka ngichithe isikhathi esiningi nginabo.
      xho_mt:
        provenance: machine
        text: >-
          Bendiqala ukumbona lomntu ekwi wheelchair yakhe. Ndiye ndachitha ixesha elininzi kunye nabo.
