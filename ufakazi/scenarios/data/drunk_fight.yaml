scenario_id: drunk_fight
domain: minor_bar_brawl
question: >-
  Below are the accounts of two people who witnessed a fight between two individuals at the local bar.
  Their accounts are conflicting. We will refer to one individual as person C and the other as person D.
  Assess their testimonies below. 

testimonies:
  - testimony_id: A
    speaker: First witness
    translations:
      en:
        provenance: source
        text: >-
          I was sitting by the bar when I saw person C walk up to person D and confront them about something.
          Person C proceeded to punch person D, after which a brawl insued.
      afr:
        provenance: human
        text: >-
          Ek het by die kroeg gesit toe ek vir persoon C sien loop het na persoon D en hulle voorgekeer het oor iets.
          Person C het toe vir persoon D geslaan, waarna 'n bakleiery uitgebreek het.
  - testimony_id: B
    speaker: Second witness
    translations:
      en:
        provenance: source
        text: >-
          I was sitting by the bar when I saw person D walk up to person C and confront them about something.
          Person D proceeded to punch person C, after which a brawl insued. 
      afr:
        provenance: human
        text: >-
          Ek het by die kroeg gesit toe ek vir persoon D sien loop het na persoon C en hulle voorgekeer het oor iets.
