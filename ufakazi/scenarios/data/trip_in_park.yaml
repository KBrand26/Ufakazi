scenario_id: trip_in_park
domain: public_accident
question: >-
  Below are the accounts of two individuals who witnessed an incident in a park where one person
  fell.  Their accounts disagree as to what happened. Assess the testimonies below.

testimonies:
  - testimony_id: A
    speaker: First witness
    translations:
      en:
        provenance: source
        text: >-
          I was sitting on a bench reading when I saw Person C trip Person D,
          who then fell to the ground.
      afr:
        provenance: human
        text: TBD
      afr_mt:
        provenance: machine
        text: Ek het langs die passasier gesit en hulle sien vertrek voordat ek die bestuurder betaal het.
      zul_mt:
        provenance: machine
        text: Ngangihlezi eceleni komgibeli ngababona behamba ngaphambi kokukhokhela umshayeli.
      xho_mt:
        provenance: machine
        text: Bendihleli ecaleni kwe passanger ndababona behamba bengekabhatali umqhubi.

  - testimony_id: B
    speaker: Second witness
    translations:
      en:
        provenance: source
        text: >-
          I was walking my dog nearby when I saw Person D trip over a rock on the path
          and fall to the ground.
      afr:
        provenance: human
        text: TBD
      afr_mt:
        provenance: machine
        text: Ek het met my hond daar naby gaan stap toe ek sien hoe Persoon D oor 'n rots op die paadjie trippel
          en val op die grond.
      zul_mt:
        provenance: machine
        text: Bengihambisa inja yami eduze ngenkathi ngibona u-Person D egibela idwala endleleni
          futhi awe phansi.
      xho_mt:
        provenance: machine
        text: Ndandihamba nenja yam kufutshane xa ndabona uMntu D ekhwela ilitye endleleni
          aze awe emhlabeni.
