scenario_id: cheating
domain: cheating
question: >-
  Below are the accounts of two students who sat close to a student who was accused of cheating on a test.
  They both have conflicting statements. Assess their testimonies below.

testimonies:
  - testimony_id: A
    speaker: First witness
    translations:
      en:
        provenance: source
        text: >-
          I sat two rows behind the student. I saw them reach into their bag for a tissue to blow their nose.
          Thereafter, they proceeded to write their test.
      afr:
        provenance: human
        text: >-
          Ek het twee rye agter die student gesit. Ek het hulle gesien 'n tissue uit hulle tas uit haal en hulle neus blaas.
          Daarna het hulle die toets klaar geskryf.
      afr_mt:
        provenance: machine
        text: >-
          Ek het twee rye agter die student gesit. Ek het gesien hoe hulle in hul sak gryp na 'n sneesdoekie om hul neus te blaas.
          Daarna het hulle voortgegaan om hul toets te skryf.
      zul_mt:
        provenance: machine
        text: >-
          Ngahlala imigqa emibili ngemuva komfundi. Ngababona befaka isandla esikhwameni sabo befuna i-tissue yokubakhipha amakhala.
          Ngemva kwalokho, baqhubeka nokubhala ukuhlolwa kwabo.
      xho_mt:
        provenance: machine
        text: >-
          Ndahlala imiqolo emibini emva komfundi. Ndababona befaka isandla ebhegini yabo befuna ithishu yokuvuthela impumlo.
          Emva koko, baqhubeka bebhala uvavanyo lwabo.

  - testimony_id: B
    speaker: Second witness
    translations:
      en:
        provenance: source
        text: >-
          I sat two rows behind the student. They grabbed a piece of paper from their bag which they looked at.
          They then proceeded to write their test.
      afr:
        provenance: human
        text: >-
          Ek het twee rye agter die student gesit. Hulle het 'n stuk papier uit hulle tas uit gehaal en daarna gekyk.
          Daarna het hulle die toets klaar geskryf.
      afr_mt:
        provenance: machine
        text: >-
          Ek het twee rye agter die student gesit. Hulle het 'n stuk papier uit hul sak gegryp wat hulle bekyk het.
          Hulle het toe voortgegaan om hul toets te skryf.
      zul_mt:
        provenance: machine
        text: >-
          Ngahlala imigqa emibili ngemuva komfundi. Athathe ipheshana esikhwameni alibuke.
          Base beqhubeka nokubhala isivivinyo sabo.
      xho_mt:
        provenance: machine
        text: >-
          Ndahlala imiqolo emibini emva komfundi. Bathatha iphetshana ebhegini yabo balijonga.
          Baqhubeka ke babhala uvavanyo lwabo.
