scenario_id: cheating
domain: cheating
question: >-
  Below are the accounts of two students who sat close to a student who was accused of cheating on a test.
  They both have conflicting statements. Assess their testimonies below. 

testimonies:
  - testimony_id: A
    speaker: First witness
    translations:
      en:
        provenance: source
        text: >-
          I sat two rows behind the student. I saw them reach into their bag for a tissue to blow their nose.
          Thereafter, they proceeded to write their test.
      afr:
        provenance: human
        text: >-
          Ek het twee rye agter die student gesit. Ek het hulle gesien 'n tissue uit hulle tas uit haal en hulle neus blaas.
          Daarna het hulle die toets klaar geskryf.

  - testimony_id: B
    speaker: Second witness
    translations:
      en:
        provenance: source
        text: >-
          I sat two rows behind the student. They grabbed a piece of paper from their bag which they looked at.
          They then proceeded to write their test.
      afr:
        provenance: human
        text: >-
          Ek het twee rye agter die student gesit. Hulle het 'n stuk papier uit hulle tas uit gehaal en daarna gekyk.
          Daarna het hulle die toets klaar geskryf.