scenario_id: hair_in_food
domain: food_complaint
question: >-
  Below are the accounts of two individuals who saw a strand of hair end up in a diner's food at a
  restaurant. Their accounts disagree as to how the hair got there. Assess the testimonies below.

testimonies:
  - testimony_id: A
    speaker: First witness
    translations:
      en:
        provenance: source
        text: >-
          I was sitting nearby and saw Person C lean over Person D's plate,
          dropping a strand of hair in their food.
      afr:
        provenance: human
        text: TBD
      afr_mt:
        provenance: machine
        text: Ek het naby gesit en sien hoe Persoon C oor Persoon D se bord leun,
          n string hare in hul kos laat val.
      zul_mt:
        provenance: machine
        text: Ngangihlezi eduze ngabona uMuntu C encike phezu kwepuleti likaMuntu D,
          bewisa umucu woboya ekudleni kwabo.
      xho_mt:
        provenance: machine
        text: Ndihleli kufuphi ndabona uC' echophe phezu kwe plate ka Person D,
          bewisa inwele ekutyeni kwabo.

  - testimony_id: B
    speaker: Second witness
    translations:
      en:
        provenance: source
        text: >-
          I was sitting nearby and saw a strand of Person D's own hair fall into their food
          while they were eating.
      afr:
        provenance: human
        text: TBD
      afr_mt:
        provenance: machine
        text: Ek het daar naby gesit en sien hoe 'n string van Persoon D se eie hare in hul kos val
          terwyl hulle geëet het.
      zul_mt:
        provenance: machine
        text: Ngangihlezi eduze futhi ngabona umucu wezinwele zikaMuntu D uqobo ziwela ekudleni kwabo
          besadla.
      xho_mt:
        provenance: machine
        text: Bendihleli kufutshane ndabona inwele zika Person D uqobo ziwela ekutyeni kwabo
          babe besitya.
