scenario_id: soccer_foul
domain: sport_dispute
question: >-
  Below are the accounts of two spectators who watched a soccer match in which a player went down inside
  the penalty box. Their accounts disagree as to whether there was a foul. Assess the testimonies below.

testimonies:
  - testimony_id: A
    speaker: First witness
    translations:
      en:
        provenance: source
        text: >-
          I was watching from the stands and saw Person C deliberately trip Person D
          inside the penalty box.
      afr:
        provenance: human
        text: TBD
      afr_mt:
        provenance: machine
        text: Ek het vanaf die erwe gekyk en gesien hoe Persoon C doelbewus Persoon D struikel
          binne die strafkas.
      zul_mt:
        provenance: machine
        text: Ngangibukele ngimi ngasezitendi ngabona uMuntu C egibela uMuntu D ngamabomu
          ngaphakathi kwebhokisi lamaphenathi.
      xho_mt:
        provenance: machine
        text: Ndandibukele ndikwindawo yokumisa ndabona uMntu C ekhwelisa uMntu uD ngabom
          ngaphakathi kwibhokisi yesohlwayo.

  - testimony_id: B
    speaker: Second witness
    translations:
      en:
        provenance: source
        text: >-
          I was watching from the stands and saw Person D trip over their own feet inside the penalty box.
          Person C never touched them.
      afr:
        provenance: human
        text: TBD
      afr_mt:
        provenance: machine
        text: Ek het vanaf die staanplek gekyk en gesien hoe Persoon D oor hul eie voete binne die strafkas trippel.
          Persoon C het nooit aan hulle geraak nie.
      zul_mt:
        provenance: machine
        text: Ngangibukele ngimi ngasezitendi ngabona u-D egibela izinyawo zakhe ngaphakathi kwebhokisi lamaphenathi.
          Umuntu C akakaze abathinte.
      xho_mt:
        provenance: machine
        text: Ndandibukele ndimi ndaza ndabona uMntu u-D ewela ezinyaweni zakhe ngaphakathi kwibhokisi yesohlwayo.
          Umntu C akazange abaphathe.
