scenario_id: dog_vs_kid
domain: dog_accident
question: >-
  Below are the accounts of two individuals who witnessed a dog attack on a child. Their accounts disagree as to why the dog attacked the child. Assess the testimonies below. 

testimonies:
  - testimony_id: A
    speaker: First witness
    translations:
      en:
        provenance: source
        text: >-
          When I was walking past the lady with her dog and the child who walked past the lady, the dog attacked the child who simply stood there. 
  - testimony_id: B
    speaker: Second witness
    translations:
      en:
        provenance: source
        text: >-
          I was watering my garden when I saw the child provoke the dog by throwing stones at them. To protect themselves, the dog attacked the child. 