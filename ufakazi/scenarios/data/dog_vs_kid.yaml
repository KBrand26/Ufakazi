scenario_id: dog_injury_accusation
domain: dog_accident
question: >-
  Below are the accounts of two indviduals who witnesses a dog attack on a child. Their accounts disagree as to why the dog attacked the child. Assess the testimonies below. 

testimonies:
  - testimony_id: A
    speaker: First witness
    translations:
      en:
        provenance: human
        text: >-
          When I walking past the lady with her dog and the child who walked past the lady, the dog attacked the child who simply stood there. 
  - testimony_id: B
    speaker: Second witness
    translations:
      en:
        provenance: human
        text: >-
        I was watering my garden when I saw the child provoke the dog by throwing stones at them. To protect themselves, the dog attacked the child. 