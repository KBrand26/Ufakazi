scenario_id: loan_vs_gift
domain: money_dispute
question: >-
  Below are the accounts of two individuals who disagree over money that was exchanged between them.
  Their accounts differ from each other. Assess the testimonies below.

testimonies:
  - testimony_id: A
    speaker: First witness
    translations:
      en:
        provenance: source
        text: >-
          I lent them money with the verbal agreement that they would pay it back
          but they have not.
      afr:
        provenance: human
        text: TBD
      afr_mt:
        provenance: machine
        text: Ek het vir hulle geld geleen met die mondelinge ooreenkoms dat hulle dit sou terugbetaal
          maar hulle het nie.
      zul_mt:
        provenance: machine
        text: Ngababoleka imali ngesivumelwano somlomo sokuthi bazoyibuyisela
          kodwa kabazange.
      xho_mt:
        provenance: machine
        text: Ndaboleka imali ngesivumelwano somlomo sokuba baza kuyibuyisela
          kodwa abanayo.

  - testimony_id: B
    speaker: Second witness
    translations:
      en:
        provenance: source
        text: >-
          They gave me money without any agreement that I would pay them back.
      afr:
        provenance: human
        text: TBD
      afr_mt:
        provenance: machine
        text: Hulle het vir my geld gegee sonder enige ooreenkoms dat ek hulle sou terugbetaal.
      zul_mt:
        provenance: machine
        text: Banginika imali ngaphandle kwesivumelwano sokuthi ngizobabuyisela.
      xho_mt:
        provenance: machine
        text: Bandinika imali bengavumelananga nokuba ndizobabhatala.
