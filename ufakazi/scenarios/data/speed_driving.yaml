scenario_id: speed_driving
domain: traffic_violations
question: >-
  Below are the accounts of two drivers who witnessed a driver in a silver Hyundai who has been accused of speeding in a
  120 km/h zone. They have conflicting statements. Assess their testimonies below. 

testimonies:
  - testimony_id: A
    speaker: First witness
    translations:
      en:
        provenance: source
        text: >-
          I was driving at 120km/h and I passed the silver Hyundai on the freeway.
      afr:
        provenance: human
        text: >-
          Ek het 120km/h gery toe ek die silwer Hyundai verbygevat het op die snelweg.
      afr_mt:
        provenance: machine
        text: >-
          Ek het teen 120 km/h gery en ek het die silwer Hyundai op die snelweg verbygesteek.
  - testimony_id: B
    speaker: Second witness
    translations:
      en:
        provenance: source
        text: >-
          The silver Hyundai passed me on the freeway while I was driving at 120km/h.
      afr:
        provenance: human
        text: >-
          Die silwer Hyundai het my op die snelweg verbygevat terwyl ek 120km/h gery het.
      afr_mt:
        provenance: machine
        text: >-
          Die silwer Hyundai het my op die snelweg verbygesteek terwyl ek teen 120 km/h gery het.