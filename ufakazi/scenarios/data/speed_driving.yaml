scenario_id: speed_driving
domain: traffic_violations
question: >-
  Below are the accounts of two drivers who witnessed a driver in a silver Hyundai who has been accused of speeding in a
  120 km/h zone. They have conflicting statements. Assess their testimonies below. 

testimonies:
  - testimony_id: A
    speaker: First witness
    translations:
      en:
        provenance: source
        text: >-
          I was driving at 120km/h and I passed the silver Hyundai on the freeway.


  - testimony_id: B
    speaker: Second witness
    translations:
      en:
        provenance: source
        text: >-
          The silver Hyundai passed me on the freeway while I was driving at 120km/h.