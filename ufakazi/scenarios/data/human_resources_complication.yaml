scenario_id: human_resources_complication
domain: human_resources
question: >-
  Two employees at a financial firm witnessed their manager hugging a female colleague.
  Their accounts disagree as to whether the physical contact was appropriate. Assess the testimonies below. 

testimonies:
  - testimony_id: A
    speaker: First witness
    translations:
      en:
        provenance: source
        text: >-
          I saw my manager walk up to and hug my colleague for an extended period of time.
          It seemed very inappropriately intimate and she seemed very uncomfortable.
      afr:
        provenance: human
        text: >-
          Ek het my bestuurder sien na my kollega toe sien loop, waarna hy haar vir 'n lang tydperk 'n drukkie gegee het.
          Dit het onvanpaslik intiem gelyk en sy het nie baie gemaklik gelyk nie.
      afr_mt:
        provenance: machine
        text: >-
          Ek het gesien hoe my bestuurder na my kollega toe stap en hom vir 'n lang tydperk omhels.
          Dit het baie onvanpas intiem gelyk en sy het baie ongemaklik gelyk.
  - testimony_id: B
    speaker: Second witness
    translations:
      en:
        provenance: source
        text: >-
          My manager walked up to my colleague and hugged her briefly. It seemed like a friendly hug where both
          parties were comfortable with the situation.
      afr:
        provenance: human
        text: >-
          My bestuurder het na my kollega toe geloop en vir haar 'n vinnige drukkie gegee. Dit het soso 'n
          vriendelike drukkie gelyk waar beide partye gemaklik was met die situasie.
      afr_mt:
        provenance: machine
        text: >-
          My bestuurder het na my kollega gestap en haar kortliks omhels. Dit het gelyk soos 'n vriendelike drukkie
          waar beide partye gemaklik was met die situasie.