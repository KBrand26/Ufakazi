scenario_id: queue_jump
domain: retail_dispute
question: >-
  Below are the accounts of two individuals who were standing in a queue at a shop when a dispute broke
  out over someone cutting the line. Their accounts disagree as to who jumped the queue.
  Assess the testimonies below.

testimonies:
  - testimony_id: A
    speaker: First witness
    translations:
      en:
        provenance: source
        text: >-
          I was waiting further back in the queue and saw Person D cut in front of Person C
          who stood there first.
      afr:
        provenance: human
        text: TBD
      afr_mt:
        provenance: machine
        text: Ek het verder agter in die ry gewag en gesien hoe Persoon D voor Persoon C insny
          wie eerste daar gestaan ​​het.
      zul_mt:
        provenance: machine
        text: Ngisalinde emuva kakhulu kulayini futhi ngabona uMuntu D esika phambi koMuntu C
          owama lapho kuqala.
      xho_mt:
        provenance: machine
        text: Ndithe ndisalinde umva emgceni ndabona uMntu D esika phambi koMntu C
          owama apho kuqala.

  - testimony_id: B
    speaker: Second witness
    translations:
      en:
        provenance: source
        text: >-
          I was waiting further back in the queue and saw Person C try to cut ahead of Person D,
          who had been standing there first.
      afr:
        provenance: human
        text: "[TODO: human Afrikaans (calibration) translation]"
      afr_mt:
        provenance: machine
        text: Ek het verder agter in die tou gewag en gesien hoe Persoon C voor Persoon D probeer sny,
          wat eerste daar gestaan ​​het.
      zul_mt:
        provenance: machine
        text: Bengilokhu ngilindile emuva kulayini ngabona uMuntu C ezama ukudlula kuMuntu D,
          owayekade emi lapho kuqala.
      xho_mt:
        provenance: machine
        text: Ndilinde umva emgceni ndabona uMntu C ezama ukusika ngaphambi koMntu D,
          ababemi apho kuqala.
