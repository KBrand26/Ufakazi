scenario_id: coffee_laptop
domain: property_damage
question: >-
  Below are the accounts of two individuals who were in a cafe when coffee was spilled onto a laptop.
  Their accounts disagree as to what caused the spill. Assess the testimonies below.

testimonies:
  - testimony_id: A
    speaker: First witness
    translations:
      en:
        provenance: source
        text: >-
          I was sitting at the next table and saw Person C knock their coffee onto Person D's laptop.
      afr:
        provenance: human
        text: ""

  - testimony_id: B
    speaker: Second witness
    translations:
      en:
        provenance: source
        text: >-
          I was sitting at the next table and saw Person D pull the shared table,
          which tipped Person C's coffee onto their laptop.
      afr:
        provenance: human
        text: ""
