scenario_id: coffee_laptop
domain: property_damage
question: >-
  Below are the accounts of two individuals who were in a cafe when coffee was spilled on a laptop.
  Their accounts disagree as to what caused the spill. Assess the testimonies below.

testimonies:
  - testimony_id: A
    speaker: First witness
    translations:
      en:
        provenance: source
        text: >-
          I was sitting nearby and saw Person C knock their coffee onto Person D's laptop.
      afr:
        provenance: human
        text: >-
          Ek het naby gesit en gesien hoe Persoon C hulle koffie op Person D se skootrekenaar omstamp.
      afr_mt:
        provenance: machine
        text: Ek het naby gesit en gesien hoe Persoon C hul koffie op Persoon D se skootrekenaar slaan.
      zul_mt:
        provenance: machine
        text: Ngangihlezi eduze futhi ngabona u-Person C engqongqoza ikhofi lakhe kwi-laptop ka-Person D.
      xho_mt:
        provenance: machine
        text: Ndihleli kufutshane ndabona uCr ebetha ikofu yakhe kwilaptop kaPerson D.

  - testimony_id: B
    speaker: Second witness
    translations:
      en:
        provenance: source
        text: >-
          I was sitting nearby and saw Person D pull the shared table,
          which tipped Person C's coffee onto their laptop.
      afr:
        provenance: human
        text: >-
          Ek het naby gesit en gesien hoe Persoon D die gedeelde tafel trek,
          wat Persoon C se koffie op Persoon D se skootrekenaar laat omval het.
      afr_mt:
        provenance: machine
        text: Ek het naby gesit en gesien hoe Persoon D die gedeelde tafel trek,
          wat Persoon C se koffie op hul skootrekenaar gestort het.
      zul_mt:
        provenance: machine
        text: Ngangihlezi eduze ngabona u-D edonsa itafula elihlanganyelwayo,
          owathipha ikhofi lika-Person C kwi-laptop yakhe.
      xho_mt:
        provenance: machine
        text: Ndandihleli kufutshane ndabona uMntu D etsala itafile ekwabelwana ngayo,
          owanika ikofu kaMntu C kwilaptop yakhe.
