scenario_id: waiter_glasses
domain: property_damage
question: >-
  Below are the accounts of two individuals who saw a waiter drop a tray of glasses in a restaurant.
  Their accounts disagree as to what caused the glasses to break. Assess the testimonies below.

testimonies:
  - testimony_id: A
    speaker: First witness
    translations:
      en:
        provenance: source
        text: >-
          I was seated near the counter and saw the waiter bump into a cabinet,
          which made the glasses on their tray fall and break.
      afr:
        provenance: human
        text: TBD
      afr_mt:
        provenance: machine
        text: Ek het naby die toonbank gesit en sien hoe die kelner teen 'n kas stamp,
          wat die glase op hul skinkbord laat val en breek het.
      zul_mt:
        provenance: machine
        text: Ngihlaliswe eduze kwekhawunta ngabona uweta eshayisa ikhabethe,
          okwenze izibuko zethreyi labo zawa zaphuka.
      xho_mt:
        provenance: machine
        text: Ndihleli kufutshane nekhawuntara ndabona iwaiter ingqubeka kwikhabhathi,
          nto leyo eyenza ukuba iiglasi ezikwitreyi zabo ziwe zaphuka.

  - testimony_id: B
    speaker: Second witness
    translations:
      en:
        provenance: source
        text: >-
          I was seated near the counter and saw another customer bump into the waiter,
          which made the glasses on their tray fall and break.
      afr:
        provenance: human
        text: TBD
      afr_mt:
        provenance: machine
        text: Ek het naby die toonbank gesit en sien hoe 'n ander klant teen die kelner stamp,
          wat die glase op hul skinkbord laat val en breek het.
      zul_mt:
        provenance: machine
        text: Ngihlaliswe eduze kwekhawunta ngabona elinye ikhasimende lishayisa uweta,
          okwenze izibuko zethreyi labo zawa zaphuka.
      xho_mt:
        provenance: machine
        text: Ndihleli kufutshane nekhawuntara ndabona omnye umthengi engqubeka kwi waiter,
          nto leyo eyenza ukuba iiglasi ezikwitreyi zabo ziwe zaphuka.
