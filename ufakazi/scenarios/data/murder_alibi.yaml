scenario_id: murder_alibi
domain: crime_cases
question: >-
  Below are the accounts of two individuals who have expressed their knowledge of where they saw someone who
  has been accused of a murder that took place in a park. Each of the witnesses are acquaintances of the accused.
  They have conflicting statements. Assess their testimonies below. 

testimonies:
  - testimony_id: A
    speaker: First witness
    translations:
      en:
        provenance: source
        text: >-
          I could see the accused working from my apartment window. They were busy for the entire evening of the murder.
          They could not have been at the park at the time.


  - testimony_id: B
    speaker: Second witness
    translations:
      en:
        provenance: source
        text: >-
          When walking back home from work, I saw the accused running out of a park. This was around the time of the murder.