scenario_id: taxi_fare
domain: transport_dispute
question: >-
  Below are the accounts of two passengers who were in a minibus taxi when a dispute broke out
  over an unpaid fare. Their accounts disagree as to whether the passenger paid. Assess the testimonies below.

testimonies:
  - testimony_id: A
    speaker: First witness
    translations:
      en:
        provenance: source
        text: >-
          I was sitting beside the passenger and saw them hand the fare to the driver
          before getting out of the taxi.
      afr:
        provenance: human
        text: >-
          Ek het langsaan die passasier gesit en gesien hoe hulle die bestuurder betaal voordat 
          hulle uit die taxi geklim het.
      afr_mt:
        provenance: machine
        text: Ek het langs die passasier gesit en gesien hoe hulle die tarief aan die bestuurder gee
          voor jy uit die taxi klim.
      zul_mt:
        provenance: machine
        text: Bengihlezi eceleni komgibeli ngabona benikeza umshayeli imali yokugibela
          ngaphambi kokwehla etekisini.
      xho_mt:
        provenance: machine
        text: Bendihleli ecaleni kwe passanger ndabona benika u driver imali yokhwela
          phambi kokuba uphume eteksini.

  - testimony_id: B
    speaker: Second witness
    translations:
      en:
        provenance: source
        text: >-
          I was sitting beside the passenger and saw them leave before paying the driver.
      afr:
        provenance: human
        text: >-
          Ek het langsaan die passasier gesit en gesien hoe hulle uitklim sonder om vir die bestuurder te betaal.
      afr_mt:
        provenance: machine
        text: Ek het langs die passasier gesit en hulle sien vertrek voordat ek die bestuurder betaal het.
      zul_mt:
        provenance: machine
        text: Ngangihlezi eceleni komgibeli ngababona behamba ngaphambi kokukhokhela umshayeli.
      xho_mt:
        provenance: machine
        text: Bendihleli ecaleni kwe passanger ndababona behamba bengekabhatali umqhubi.
