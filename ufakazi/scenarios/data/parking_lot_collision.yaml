# Synthetic scenario. No real people or events. Two witnesses give contradictory,
# deliberately evidence-balanced accounts of the same low-speed collision: each has a
# clear vantage point, one concrete corroborating detail, and one minor self-admission.
# M1 holds both testimonies in the English source language (a same-language control).
# Later milestones add `af`, `xh`, `zu` translation entries under each testimony.
scenario_id: parking_lot_collision
domain: minor_traffic_dispute
question: >-
  Two shoppers witnessed the same low-speed collision between a white hatchback and a
  grey sedan in a shopping-centre parking lot. Their accounts disagree about which car
  was moving. Assess the two testimonies below.

testimonies:
  - testimony_id: A
    speaker: First witness
    translations:
      en:
        provenance: source
        text: >-
          I was loading bags into my boot about three cars away, facing the lane. The
          grey sedan was reversing out of its bay and kept going while the white
          hatchback was already stopped, waiting for it. I heard the sedan's reverse
          beeper before the bump. I will admit I glanced down at my trolley for a
          second, but when I looked up the sedan was still rolling backwards into the
          hatchback's door. The hatchback had not moved from where it sat.
      afr:
        provenance: human
        text: >-
          Ek was drie karre weg, besig om my sakke in die kattebak te laai en het in die rigting van die baan gekyk.
          Die grys sedan het teruggestoot uit die parkering uit en aangehou ry terwyl die wit luikrug reeds gestop het en gewag het.
          Ek het die sedan se tru-alarm gehoor voor die stamp. Ek sal bieg dat ek vir 'n oomblik afgekyk het na my trolley,
          maar toe ek opgekyk het was die sedan steeds besig om terug te rol in die luikrug se deur vas. Die luikrug het glad nie
          beweeg nie.
      afr_mt:
        provenance: machine
        text: >-
          Ek was besig om sakke in my kattebak te laai omtrent drie motors verder, met die gesig na die baan toe.
          Die grys sedan het uit sy baai gestruikel en aangehou ry terwyl die wit luikrug reeds stilgestaan
          ​​en daarvoor gewag het. Ek het die sedan se trurat- pieper gehoor voor die hobbel. Ek moet erken ek het vir
          'n sekonde na my trollie afgekyk, maar toe ek opkyk, het die sedan steeds agteruit in die luikrug se deur gerol.
          Die luikrug het nie van waar dit gestaan ​​het, beweeg nie.
      zulu_mt:
        provenance: machine
        text: >-
          Bengilayisha izikhwama ebhuthini yami cishe izimoto ezintathu, ngibheke emzileni. I
          i-gray sedan yayihlehla iphuma ethekwini layo futhi ilokhu ihamba ngenkathi emhlophe
          I-hatchback yayivele imisiwe, ilindile. Ngizwe i-reverse ye-sedan
          i-beeper ngaphambi kwe-bump. Ngizovuma ukuthi ngibheke phansi ku-trolley yami ukuthola
          okwesibili, kodwa lapho ngibheka phezulu i-sedan yayilokhu ihlehla ingena ngaphakathi
          umnyango we-hatchback. I-hatchback ibingakasuki lapho ibihleli khona.
      xhosa_mt:
        provenance: machine
        text: >-
          Bendifaka iibhegi ebhuthini yam malunga neemoto ezintathu kude, ndijonge indlela. I
          Ingwevu i-sedan yayibuya umva iphuma kwi-bay yayo kwaye yaqhubeka ihamba ngelixa imhlophe
          I hatchback yayisele imisiwe, ilindile. Ndive i reverse ye sedan
          i-beeper ngaphambi kwe-bump. Ndiya kuvuma ndajonga phantsi kwitroli yam
          okwesibini, kodwa xa ndijonga phezulu i-sedan ibisaqengqeleka ngasemva kwi
          umnyango we-hatchback. Ihatchback ibingasuki apho ibihleli khona.

  - testimony_id: B
    speaker: Second witness
    translations:
      en:
        provenance: source
        text: >-
          I was pushing my trolley back to the bay directly opposite, looking straight
          across the lane. The white hatchback was pulling forward out of its space and
          clipped the grey sedan, which had already finished reversing and was sitting
          still in the lane. I had music in my earphones so I did not hear much, but I
          saw the hatchback's front wheels turn and move first. The sedan's brake lights
          were on the whole time, stopped.
      afr:
        provenance: human
        text: >-
          Ek was besig om my trollie terug te stoot na die parkering oorkant my en het reguit oor die baan gekyk.
          Die wit luikrug was besig om vorentoe te ry uit sy parkeing uit en het die grys sedan getref, wat klaar teruggestoot
          het en stilgestaan het in die baan. Ek het musiek in my oorfone gehad so ek het nie veel gehoor nie, maar ek het
          die luikrug se voorste wiele sien draai en eerste beweeg. Die sedan se briekligte was heeltyd aan terwyl dit stilgestaan het.
      afr_mt:
        provenance: machine
        text: >-
          Ek het my trollie teruggestoot na die oorkantste parkeerplek en reguit gekyk oor die baan. Die wit luikrug
          het vorentoe uit sy spasie getrek en die grys sedan getref, wat reeds klaar agteruit gery het en stilgestaan
          ​​het in die baan. Ek het musiek in my oorfone gehad, so ek het nie veel gehoor nie, maar ek het die luikrug
          se voorwiele eerste sien draai en beweeg. Die sedan se remligte was die hele tyd aan, stil.
      zulu_mt:
        provenance: machine
        text: >-
          Bengiphusha inqola yami ngibuyela ethekwini elibhekene ngqo, ngibheke ngqo
          ngaphesheya komzila. I-hatchback emhlophe yayidonsela phambili ngaphandle kwesikhala sayo futhi
          wagunda i-sedan empunga, eseqedile ukuhlehla futhi ehlezi
          ngisesendleleni. Nganginomculo kuma-earphone ami ngakho angizwanga okuningi, kodwa mina
          wabona amasondo angaphambili e-hatchback ephenduka futhi ehamba kuqala. Amalambu amabhuleki e-sedan
          zazikhona sonke isikhathi, zamiswa.
      xhosa_mt:
        provenance: machine
        text: >-
          Bendityhala I trolley yam ndibuyela ebhayi ngqo, ndijonge ngqo
          ngaphaya kwendlela. I-hatchback emhlophe yayitsala phambili ngaphandle kwendawo yayo kwaye
          unqumle i-sedan engwevu, ebesele egqibile ukubuya umva ehleli
          ndisesendleleni. Ndandinomculo kwi-earphones zam ngoko andizange ndive kakhulu, kodwa mna
          wabona amavili angaphambili e-hatchback ejika kwaye ehamba kuqala. Izibane zeziqhoboshi zesedan
          zazikho ngalo lonke ixesha, zayeka.
