scenario_id: kidnapping
domain: kidnapping
question: >-
  Below are the accounts of two parents whereby one is accusing the other of kidnapping their children.
  They both have conflicting statements. Assess their testimonies below. 

testimonies:
  - testimony_id: A
    speaker: First witness
    translations:
      en:
        provenance: source
        text: >-
          My ex-husband kidnapped our children and took them to Spain, without my consent.
      afr:
        provenance: human
        text: >-
          My eks-man het ons kinders ontvoer en na Spanje geneem, sonder my toestemming.
      afr_mt:
        provenance: machine
        text: >-
          My eksman het ons kinders ontvoer en hulle na Spanje geneem, sonder my toestemming.
  - testimony_id: B
    speaker: Second witness
    translations:
      en:
        provenance: source
        text: >-
          I took our children to Spain after getting my ex-wife's approval.
      afr:
        provenance: human
        text: >-
          Ek het ons kinders na Spanje geneem na ek toestemming van my eks-vrou gekry het.
      afr_mt:
        provenance: machine
        text: >-
          Ek het ons kinders na Spanje geneem nadat ek my eksvrou se goedkeuring gekry het.