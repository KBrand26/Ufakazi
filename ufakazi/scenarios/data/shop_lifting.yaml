scenario_id: shop_lifting
domain: minor_shop_lifting_dispute
question: >-
  Two shoppers witnessed a young boy walk into a candy shop.
  Their accounts disagree about what the young boy was doing. Assess the testimonies below.

testimonies:
  - testimony_id: A
    speaker: First witness
    translations:
      en:
        provenance: source
        text: >-
          I was in the store buying some chocolates for my husband when I noticed
          the boy taking a chocolate from the shelf and putting it in his backpack before leaving.
      afr:
        provenance: human
        text: >-
          Ek was in die winkel besig om sjokolades vir my man te koop toe ek gesien het hoe
          die seun 'n sjokolade van die rak af vat en in sy rugsak sit voor hy geloop het.
      afr_mt:
        provenance: machine
        text: >-
          Ek was in die winkel besig om sjokolade vir my man te koop toe ek opgemerk het hoe die
          seun 'n sjokolade van die rak af haal en dit in sy rugsak sit voordat hy vertrek.
      zulu_mt:
        provenance: machine
        text: >-
          Bengisesitolo ngithengela umyeni wami oshokoledi ngesikhathi ngibona
          umfana ethatha ushokoledi eshalofini awufake esikhwameni sakhe ngaphambi kokuba ahambe.
      xhosa_mt:
        provenance: machine
        text: >-
          Bendisevenkileni ndithengela umyeni wam iichocolates ndaqaphela
          inkwenkwe ithatha itshokolethi eshelufini iyifake kubhaka wayo phambi kokuba ihambe.
  - testimony_id: B
    speaker: Second witness
    translations:
      en:
        provenance: source
        text: >-
          I was in the store with a friend when I saw the boy pick up a chocolate from the shelf.
          After looking at it, he put it back and walked out.
      afr:
        provenance: human
        text: >-
          Ek was in die winkel met 'n vriend toe ek gesien het hoe die seun 'n sjokolade van die rak af neem.
          Na hy daarna gekyk het, het hy dit teruggesit en uitgeloop.
      afr_mt:
        provenance: machine
        text: >-
          Ek was in die winkel saam met 'n vriend toe ek die seun 'n sjokolade van die rak sien optel.
          Nadat hy daarna gekyk het, het hy dit teruggesit en uitgeloop.
      zulu_mt:
        provenance: machine
        text: >-
          Ngangisesitolo nomngane wami ngesikhathi ngibona umfana ecosha ushokoledi eshalofini.
          Eseyibuke wayibuyisela waphuma.
      xhosa_mt:
        provenance: machine
        text: >-
          Ndandisevenkileni nomhlobo wam xa ndabona umfana echola itshokolethi eshelufini.
          Emva kokuyijonga, wayibuyisela waphuma.
