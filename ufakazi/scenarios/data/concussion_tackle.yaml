scenario_id: concussion_tackle
domain: injury_dispute
question: >-
  Below are the accounts of two individuals who witnessed a collision between two people during a rugby
  match which resulted in one of them suffering a concussion. Their accounts disagree as to who caused
  the collision. Assess the testimonies below.

testimonies:
  - testimony_id: A
    speaker: First witness
    translations:
      en:
        provenance: source
        text: >-
          I was standing close by and saw Person C tackle Person D.
          Person D was left with a concussion.
      afr:
        provenance: human
        text: >-
          Ek het naby gestaan en gesien hoe Persoon C vir Persoon D plat duik.
          Persoon D het harsaanskudding gekry.
      afr_mt:
        provenance: machine
        text: Ek het naby gestaan ​​en sien hoe Persoon C Persoon D takel.
          Persoon D is met harsingskudding gelaat.
      zul_mt:
        provenance: machine
        text: Ngangimi eduze ngabona uMuntu C ebhekana noMuntu D.
          Umuntu D wasala ebanjwe yikhanda.
      xho_mt:
        provenance: machine
        text: Ndime kufutshane ndabona uMntu C equbisana no-D.
          Umntu uD washiyeka exhuzule.

  - testimony_id: B
    speaker: Second witness
    translations:
      en:
        provenance: source
        text: >-
          I was standing close by and saw Person D run aggressively into Person C.
          Person D was left with a concussion.
      afr:
        provenance: human
        text: >-
          Ek het naby gestaan en gesien hoe Persoon D aggressief in Person C vashardloop.
          Persoon D het harsaanskudding gekry.
      afr_mt:
        provenance: machine
        text: Ek het naby gestaan ​​en sien hoe Persoon D aggressief in Persoon C vashardloop.
          Persoon D is met harsingskudding gelaat.
      zul_mt:
        provenance: machine
        text: Ngangimi eduze ngabona uMuntu D egijima eyongena kuMuntu C.
          Umuntu D wasala ebanjwe yikhanda.
      xho_mt:
        provenance: machine
        text: TBNdime kufuphi ndabona u-D ebaleka eyongena kuMntu C.
          Umntu uD washiyeka exhuzule.
